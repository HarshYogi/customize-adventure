<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akshu's Adventure Date</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-bg="dawn">
  <div class="sky"></div><div class="stars"></div>
  <svg class="hills" viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true">
    <path class="h1" d="M0 190 L120 90 L220 170 L350 60 L480 180 L600 100 L800 200 V300 H0Z"/>
    <path class="h2" d="M0 240 L140 160 L260 230 L400 150 L560 235 L700 170 L800 230 V300 H0Z"/>
    <path class="h3" d="M0 285 Q200 235 400 275 T800 262 V300 H0Z"/>
  </svg>

  <main id="stage">
    <section id="landing" class="card">
      <p class="tag">a one-day adventure date</p>
      <h1>Akshu's Adventure Date</h1>
      <p class="sub">One treehouse. One valley. One whole day.<br>Every choice is yours, babygirl.</p>
      <p class="warn">Side effects may include blushing, giggling, and accidentally admitting you like me.</p>
      <button id="start" class="btn big">Start our day</button>
    </section>
    <section id="scene" class="card hidden"></section>
    <section id="finale" class="card hidden"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
